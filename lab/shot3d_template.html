<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot Chart 3D Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a1731;--bg2:#070f24;--panel:#121f38;--line:#243052;--line2:#2e3b5e;--ink:#fff;--ink2:#b3bccf;--muted:#7c86a3;--orange:#f26f21;--miss:#9aa5c0;
  --disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand .eyebrow{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:11px;color:var(--orange);text-transform:uppercase}
.brand h1{font-family:var(--disp);font-weight:800;font-size:30px;line-height:.95;margin:2px 0 0;text-transform:uppercase}
.brand h1 span{color:var(--orange)}
.who{text-align:right}.who b{font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;display:block;line-height:1}.who span{color:var(--ink2);font-size:12px}
.stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:rgba(10,23,49,.75);backdrop-filter:blur(6px)}
.seg button{background:transparent;border:0;color:var(--ink2);font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#0a1731}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--orange);border:1px solid var(--orange);color:#0a1731;font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:6px;cursor:pointer}
.btn.ghost{background:rgba(10,23,49,.75);color:var(--orange)}
.speed{display:flex;align-items:center;gap:8px;background:rgba(10,23,49,.75);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.speed input{accent-color:var(--orange);width:110px}
.cap{position:absolute;left:18px;bottom:16px;background:rgba(10,23,49,.78);border:1px solid var(--line2);border-radius:8px;padding:12px 16px;min-width:260px;backdrop-filter:blur(6px)}
.cap b{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;display:block;line-height:1}
.cap span{display:block;color:var(--ink2);font-size:12px;margin-top:4px}
.cap .bar{height:5px;background:var(--bg2);border-radius:3px;margin-top:10px;overflow:hidden}.cap .bar i{display:block;height:100%;background:var(--orange);width:0}
.legend{position:absolute;right:18px;bottom:16px;display:flex;gap:14px;font-size:12px;color:var(--ink2);background:rgba(10,23,49,.75);border:1px solid var(--line2);border-radius:6px;padding:8px 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:6px}.legend i.m{background:var(--orange)}.legend i.x{border:2px solid var(--miss)}
.hint{position:absolute;right:18px;top:16px;color:var(--muted);font-size:12px;background:rgba(10,23,49,.6);padding:6px 10px;border-radius:6px}
</style>
<header class="top">
  <div class="brand"><div class="eyebrow">Euroleague · Lab</div><h1>Shot Chart <span>3D</span></h1></div>
  <div class="who"><b id="who"></b><span id="who-sub"></span></div>
</header>
<div class="stage" id="stage">
  <div class="hud">
    <div class="row"><button class="btn" id="replay" type="button">Replay</button><button class="btn ghost" id="pause" type="button">Pause</button></div>
    <div class="seg" id="f-result"><button aria-pressed="true" data-v="all">All</button><button aria-pressed="false" data-v="made">Made</button><button aria-pressed="false" data-v="miss">Missed</button></div>
    <div class="seg" id="f-cam"><button aria-pressed="true" data-v="broadcast">Broadcast</button><button aria-pressed="false" data-v="baseline">Behind rim</button><button aria-pressed="false" data-v="high">High</button></div>
    <label class="speed">Speed <input id="speed" type="range" min="1" max="10" value="5"></label>
  </div>
  <div class="hint">Drag to orbit · scroll to zoom</div>
  <div class="cap"><b id="cap-b">Ready</b><span id="cap-s"></span><div class="bar"><i id="cap-bar"></i></div></div>
  <div class="legend"><span><i class="m"></i>Made</span><span><i class="x"></i>Missed</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = /*DATA*/;
const $ = s => document.querySelector(s);
const cap = s => s.toLowerCase().replace(/(^|[\s\-'.])(\S)/g, (m, p, c) => p + c.toUpperCase());
const [sur, first] = DATA.player.split(',').map(s => s.trim());
$('#who').textContent = `${cap(first)} ${cap(sur)}`;
$('#who-sub').textContent = `${DATA.team} · ${DATA.season} · ${DATA.shots.length} attempts (sample data)`;

// ---------- scene
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1731);
scene.fog = new THREE.Fog(0x0a1731, 22, 46);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

// court: metres, baseline at z=0, basket centre at (0, 3.05, 1.575), half court line at z=14
const RIM = new THREE.Vector3(0, 3.05, 1.575);
function courtTexture(){
  const c = document.createElement('canvas'); c.width = 1500; c.height = 1400; const g = c.getContext('2d');
  g.fillStyle = '#0d1a3a'; g.fillRect(0, 0, 1500, 1400);
  const X = x => 750 + x * 100, Z = z => z * 100;            // canvas y grows away from baseline
  g.fillStyle = '#12224a'; g.fillRect(X(-2.45), Z(0), 490, 580);
  g.strokeStyle = '#3a4a75'; g.lineWidth = 6;
  g.strokeRect(3, 3, 1494, 1394);
  g.strokeRect(X(-2.45), Z(0), 490, 580);
  g.beginPath(); g.arc(X(0), Z(5.8), 180, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(X(0), Z(1.575), 125, 0, Math.PI, false); g.stroke();
  g.beginPath(); g.moveTo(X(-6.6), Z(0)); g.lineTo(X(-6.6), Z(1.575 + 1.415));
  g.arc(X(0), Z(1.575), 675, Math.PI - Math.asin(1.415 / 6.75) , Math.asin(1.415 / 6.75), true);
  g.lineTo(X(6.6), Z(0)); g.stroke();
  g.beginPath(); g.arc(X(0), Z(14), 180, Math.PI, Math.PI * 2); g.stroke();
  g.strokeStyle = '#c9d2e8'; g.lineWidth = 8; g.beginPath(); g.moveTo(X(-0.9), Z(1.2)); g.lineTo(X(0.9), Z(1.2)); g.stroke();
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(15, 14), new THREE.MeshStandardMaterial({map: courtTexture(), roughness: .92, metalness: 0}));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 7); floor.receiveShadow = true; scene.add(floor);
// surroundings: a dark apron so the court floats on the navy
const apron = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({color: 0x08122a, roughness: 1}));
apron.rotation.x = -Math.PI / 2; apron.position.set(0, -0.01, 7); apron.receiveShadow = true; scene.add(apron);
// hoop, net, backboard, stanchion
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.225, 0.016, 12, 48), new THREE.MeshStandardMaterial({color: 0xf26f21, roughness: .4, metalness: .3}));
rim.rotation.x = Math.PI / 2; rim.position.copy(RIM); rim.castShadow = true; scene.add(rim);
const net = new THREE.Mesh(new THREE.CylinderGeometry(0.225, 0.14, 0.42, 20, 1, true), new THREE.MeshStandardMaterial({color: 0xffffff, transparent: true, opacity: .28, side: THREE.DoubleSide, wireframe: true}));
net.position.set(0, 3.05 - 0.21, 1.575); scene.add(net);
const board = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.05), new THREE.MeshStandardMaterial({color: 0xdfe6f5, transparent: true, opacity: .22, side: THREE.DoubleSide, roughness: .1}));
board.position.set(0, 3.05 + 0.45, 1.2); scene.add(board);
const boardFrame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.8, 1.05)), new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: .6}));
boardFrame.position.copy(board.position); scene.add(boardFrame);
const square = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(0.59, 0.45)), new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: .5}));
square.position.set(0, 3.05 + 0.225, 1.19); scene.add(square);
const pole = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.9, 0.16), new THREE.MeshStandardMaterial({color: 0x1f2b47, roughness: .8}));
pole.position.set(0, 1.95, -0.9); pole.castShadow = true; scene.add(pole);
const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 2.1), pole.material); arm.position.set(0, 3.85, 0.15); scene.add(arm);
// lights
scene.add(new THREE.AmbientLight(0xffffff, .55));
const key = new THREE.DirectionalLight(0xffffff, .9); key.position.set(6, 12, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left: -12, right: 12, top: 16, bottom: -6, near: 1, far: 40}); scene.add(key);
const fill = new THREE.DirectionalLight(0xf26f21, .18); fill.position.set(-8, 6, 14); scene.add(fill);

// ---------- camera orbit
const cam = {target: new THREE.Vector3(0, 1.4, 4.5), az: 0, el: 0.42, dist: 17, drift: true};
const PRESETS = {broadcast: {az: 0, el: 0.42, dist: 17}, baseline: {az: Math.PI, el: 0.36, dist: 11}, high: {az: 0, el: 1.1, dist: 20}};
function applyCam(){ const {target, az, el, dist} = cam; camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az)); camera.lookAt(target); }
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY}; cam.drift = false; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!drag) return; cam.az -= (e.clientX - drag.x) * 0.006; cam.el = Math.max(0.12, Math.min(1.45, cam.el + (e.clientY - drag.y) * 0.004)); drag = {x: e.clientX, y: e.clientY}; });
renderer.domElement.addEventListener('pointerup', () => drag = null);
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(6, Math.min(34, cam.dist * (1 + e.deltaY * 0.0012))); }, {passive: false});
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- shots
const ballGeo = new THREE.SphereGeometry(0.123, 24, 18);
const ballMat = new THREE.MeshStandardMaterial({color: 0xf26f21, roughness: .55});
const madeMat = new THREE.MeshBasicMaterial({color: 0xf26f21});
const missMat = new THREE.MeshBasicMaterial({color: 0x9aa5c0});
const missBallMat = new THREE.MeshStandardMaterial({color: 0x9aa5c0, roughness: .6});
const markGeoMade = new THREE.CircleGeometry(0.15, 24), markGeoMiss = new THREE.RingGeometry(0.1, 0.16, 24);
const markers = new THREE.Group(); scene.add(markers);
const flights = [];
const state = {result: 'all', speed: 5, playing: false, i: 0, list: [], timer: 0, made: 0, seen: 0};
function toWorld(s){ return new THREE.Vector3(s[2] / 100, 0, 1.575 + s[3] / 100); }
function filtered(){ return DATA.shots.filter(s => state.result === 'all' || (state.result === 'made') === !!s[4]); }
function launch(s){
  const start = toWorld(s); const dist = Math.hypot(start.x - RIM.x, start.z - RIM.z);
  const release = start.clone(); release.y = dist < 1.5 ? 2.4 : 2.05;
  let end;
  if (s[4]) end = RIM.clone();
  else { const a = Math.atan2(start.z - RIM.z, start.x - RIM.x) + (Math.random() - 0.5) * 1.2; end = new THREE.Vector3(RIM.x + Math.cos(a) * 0.23, RIM.y + 0.02, RIM.z + Math.sin(a) * 0.23); }
  const T = Math.max(0.75, Math.min(1.5, 0.55 + dist * 0.11)), apex = Math.max(1.0, Math.min(3.4, 0.6 + dist * 0.28));
  const ball = new THREE.Mesh(ballGeo, ballMat); ball.castShadow = true; scene.add(ball);
  // miss deflection: away from the shooter, slightly random
  const away = new THREE.Vector3(end.x - RIM.x, 0, end.z - RIM.z).normalize().multiplyScalar(1.6 + Math.random() * 1.4);
  away.y = 2.2 + Math.random() * 1.2; away.x += (Math.random() - 0.5) * 1.5; away.z += (Math.random() - 0.5) * 1.5;
  flights.push({ball, s, release, end, T, apex, t: 0, phase: 0, v: away, post: 0});
}
function step(dt){
  for (let k = flights.length - 1; k >= 0; k--) {
    const f = flights[k];
    if (f.phase === 0) {
      f.t += dt / f.T; const u = Math.min(1, f.t);
      f.ball.position.lerpVectors(f.release, f.end, u); f.ball.position.y = f.release.y + (f.end.y - f.release.y) * u + 4 * f.apex * u * (1 - u);
      f.ball.rotation.x += dt * 9;
      if (f.t >= 1) {
        f.phase = 1; f.post = 0;
        const p = toWorld(f.s); const m = new THREE.Mesh(f.s[4] ? markGeoMade : markGeoMiss, f.s[4] ? madeMat : missMat);
        m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.012 + markers.children.length * 0.00002, p.z); markers.add(m);
        state.seen++; state.made += f.s[4]; updateCap(f.s);
        if (!f.s[4]) f.ball.material = missBallMat;
      }
    } else {
      f.post += dt;
      if (f.s[4]) { f.ball.position.y -= dt * 2.2; if (f.ball.position.y < 2.4) f.ball.position.y -= dt * 4; }
      else { f.v.y -= 9.81 * dt; f.ball.position.addScaledVector(f.v, dt); if (f.ball.position.y < 0.12) { f.ball.position.y = 0.12; f.v.y = Math.abs(f.v.y) * 0.45; f.v.x *= 0.7; f.v.z *= 0.7; } }
      if (f.post > (f.s[4] ? 0.55 : 1.3)) { scene.remove(f.ball); flights.splice(k, 1); }
    }
  }
}
function updateCap(s){
  const n = state.list.length;
  $('#cap-b').textContent = `R${s[0]} · vs ${s[1]} · Q${s[6] > 40 ? 'OT' : Math.ceil(s[6] / 10)}`;
  $('#cap-s').textContent = `${state.seen} / ${n} attempts · ${state.made} made · ${n ? (100 * state.made / Math.max(1, state.seen)).toFixed(1) : 0}%`;
  $('#cap-bar').style.width = (100 * state.seen / n) + '%';
}
function clearAll(){ flights.forEach(f => scene.remove(f.ball)); flights.length = 0; while (markers.children.length) markers.remove(markers.children[0]); }
function replay(){
  clearAll(); state.list = filtered(); state.i = 0; state.seen = 0; state.made = 0; state.timer = 0; state.playing = true; cam.drift = true;
  $('#pause').textContent = 'Pause'; $('#cap-b').textContent = 'Playing'; $('#cap-s').textContent = `${state.list.length} attempts`; $('#cap-bar').style.width = '0%';
}
function interval(){ return 0.62 - state.speed * 0.055; }   // seconds between launches
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.playing) {
    state.timer += dt;
    while (state.timer >= interval() && state.i < state.list.length) { state.timer -= interval(); launch(state.list[state.i++]); }
    if (state.i >= state.list.length && !flights.length) { state.playing = false; $('#cap-b').textContent = 'Season complete'; }
  }
  step(dt);
  if (cam.drift && !drag) cam.az += dt * 0.05 * Math.sin(now / 9000);
  applyCam(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- wiring
$('#replay').addEventListener('click', replay);
$('#pause').addEventListener('click', () => { state.playing = !state.playing; $('#pause').textContent = state.playing ? 'Pause' : 'Resume'; });
$('#speed').addEventListener('input', e => state.speed = +e.target.value);
$('#f-result').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { $('#f-result').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); state.result = b.dataset.v; replay(); }));
$('#f-cam').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { $('#f-cam').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); Object.assign(cam, PRESETS[b.dataset.v]); cam.drift = true; }));
replay();
</script>
