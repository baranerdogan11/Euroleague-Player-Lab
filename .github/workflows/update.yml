name: Update data

on:
  schedule:
    - cron: "*/5 17-23 * * *"   # game evenings: every 5 minutes, runs only when a game has finished since the last build
    - cron: "*/5 0-1 * * *"
    - cron: "30 2 * * *"        # 02:30 UTC nightly: always runs (rosters, photos, late corrections)
  workflow_dispatch:            # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  SEASON: E2026
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.new.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Has a game finished since the last build?
        id: new
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          req = urllib.request.Request(f"https://feeds.incrowdsports.com/provider/euroleague-feeds/v2/competitions/E/seasons/{os.environ['SEASON']}/games?limit=500", headers={"User-Agent": "Mozilla/5.0"})
          feed = json.load(urllib.request.urlopen(req, timeout=60))["data"]
          final = sum(1 for g in feed if g.get("status") == "result")
          p = f"teams/{os.environ['SEASON']}/status.json"
          built = json.load(open(p))["games"] if os.path.exists(p) else -1
          run = final > built
          print(f"final games in the feed: {final}; in the last build: {built}; run: {run}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={'true' if run else 'false'}\n")
          EOF

  update:
    needs: check
    if: needs.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gate and warehouse self-tests
        run: |
          python tests/test_checks.py
          python tests/test_warehouse.py
          python tests/test_model.py
          python tests/test_profile.py
          python tests/test_service.py
          python tests/test_notes.py
          python tests/test_monitor.py

      - name: Restore feed cache
        uses: actions/cache@v4
        with:
          path: cache
          key: feeds-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: feeds-${{ env.SEASON }}-

      - name: Fetch new games, rosters and photos
        run: python fetch_season.py $SEASON

      - name: Raw-feed gate
        run: python checks.py $SEASON

      - name: Build warehouse (silver)
        run: python warehouse.py $SEASON

      - name: Play-by-play events and shot context
        run: python events.py $SEASON

      - name: Warehouse assertions
        run: python warehouse_tests.py $SEASON

      - name: Score shots with the xFG model
        run: python model/score.py $SEASON

      - name: Shooting profiles (quality vs skill, shrunk)
        run: python model/profile.py $SEASON

      - name: Scouting notes (Claude, validated; skipped without ANTHROPIC_API_KEY)
        run: python model/notes.py $SEASON

      - name: Build site (gold)
        run: python build.py $SEASON

      - name: Monitoring snapshot
        run: python model/monitor.py $SEASON

      - name: Commit and publish
        run: |
          git config user.name "euroleague-player-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update $(date -u +%Y-%m-%d\ %H:%M) UTC: $(python -c "import json;s=json.load(open('warehouse/$SEASON/status.json'));print(f\"{s['games']} games, {s['shots']} shots\")")"
            git push
          fi

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: warehouse/${{ env.SEASON }}/status.json
          if-no-files-found: ignore
