name: Update data

on:
  schedule:
    - cron: "*/5 17-23 * * *"   # game evenings: every 5 minutes, runs only when a game has finished since the last build
    - cron: "*/5 0-1 * * *"
    - cron: "30 2 * * *"        # nightly (rosters, photos, late corrections): GitHub often fires these hours late, so
    - cron: "17 3 * * *"        # several slots are scheduled; the first one that fires after 02:30 UTC does the
    - cron: "47 3 * * *"        # nightly run and the rest find it already done (see "Nightly due?" below). A dispatch
    - cron: "17 4 * * *"        # from the outside scheduler after 02:30 UTC counts the same way.
  workflow_dispatch:            # run by hand from the Actions tab, or from an external scheduler; runs only if a game has finished or the nightly is due, unless force is set
    inputs:
      force:
        description: Run even if no game has finished since the last build
        type: boolean
        default: false

permissions:
  contents: read             # only the update job, which pushes the data commit, gets write access

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  SEASON: E2026
  PL_SMOKE_REQUIRED: "1"     # a Chrome that will not start fails the run (the next run retries), never skips the site test

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.new.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # the branch tip, not the commit the run was queued at (see the update job)
      - name: Has a game finished since the last build, or is the nightly due?
        id: new
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone
          req = urllib.request.Request(f"https://feeds.incrowdsports.com/provider/euroleague-feeds/v2/competitions/E/seasons/{os.environ['SEASON']}/games?limit=500", headers={"User-Agent": "Mozilla/5.0"})
          feed = json.load(urllib.request.urlopen(req, timeout=60))["data"]
          final = sum(1 for g in feed if g.get("status") == "result")
          p = f"teams/{os.environ['SEASON']}/status.json"
          status = json.load(open(p)) if os.path.exists(p) else {}
          built = status.get("games", -1)
          # the nightly is due once per UTC day after 02:30, until a full run has finished (checked_at is written by
          # every full run that publishes, so a failed nightly is retried by the next run)
          now = datetime.now(timezone.utc)
          slot = now.replace(hour=2, minute=30, second=0, microsecond=0)
          last = datetime.fromisoformat(status["checked_at"].replace("Z", "+00:00")) if status.get("checked_at") else None
          nightly = now >= slot and (last is None or last < slot)
          run = final > built or nightly
          print(f"final games in the feed: {final}; in the last build: {built}; last full run: {last}; nightly due: {nightly}; run: {run}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={'true' if run else 'false'}\n")
          EOF

  update:
    needs: check
    if: needs.check.outputs.run == 'true' || github.event.inputs.force == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      # A run queued behind another one (concurrency group above) would otherwise check out the commit main was at
      # when it was triggered, rebuild on top of it and have its push rejected because the run ahead of it already
      # pushed. Checking out the branch tip makes it start from that run's data commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chrome for the site test
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "::error::no Chrome on the runner"; exit 1; fi
          "$CHROME" --version
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Python self-tests (every tests/test_*.py)
        run: python tests/run_all.py

      - name: Restore feed cache
        uses: actions/cache@v6
        with:
          path: cache
          key: feeds-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: feeds-${{ env.SEASON }}-

      - name: Fetch new games, rosters and photos
        run: python fetch_season.py $SEASON

      - name: Career histories from Wikipedia (cached per season)
        continue-on-error: true      # a Wikipedia outage never blocks the data publish; players keep their last stored careers
        run: python wiki_careers.py $SEASON

      - name: Raw-feed gate
        run: python checks.py $SEASON

      - name: Build warehouse (silver)
        run: python warehouse.py $SEASON

      - name: Play-by-play events and shot context
        run: python events.py $SEASON

      - name: Warehouse assertions
        run: python warehouse_tests.py $SEASON

      - name: Score shots with the xFG model
        run: python model/score.py $SEASON

      - name: Shooting profiles (quality vs skill, shrunk)
        run: python model/profile.py $SEASON

      - name: Build site (gold)
        run: python build.py $SEASON

      - name: Monitoring snapshot
        run: python model/monitor.py $SEASON

      - name: Commit and push
        id: publish
        run: |
          git config user.name "euroleague-player-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update $(date -u +%Y-%m-%d\ %H:%M) UTC: $(python -c "import json;s=json.load(open('warehouse/$SEASON/status.json'));print(f\"{s['games']} games, {s['shots']} shots\")")"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ github.run_id }}
          path: warehouse/${{ env.SEASON }}/status.json
          if-no-files-found: ignore

  deploy:
    # the commit just pushed passed every check above; a push made with GITHUB_TOKEN does not start test.yml, so the
    # data update deploys here
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
